<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#fff"/><text x="60" y="90" font-family="Georgia, serif" font-size="34" fill="#888">THE DAILY LEDGER</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#222" stroke-width="3"/><text x="60" y="210" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#111">Small teams are shipping</text><text x="60" y="290" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#111">faster than ever</text><text x="60" y="360" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#666">A survey of 400 founders found the same pattern.</text><rect x="60" y="410" width="1080" height="18" rx="9" fill="#e6e6e6"/><rect x="60" y="450" width="980" height="18" rx="9" fill="#e6e6e6"/><rect x="60" y="490" width="1040" height="18" rx="9" fill="#e6e6e6"/><rect x="60" y="530" width="860" height="18" rx="9" fill="#e6e6e6"/><rect x="60" y="570" width="1000" height="18" rx="9" fill="#e6e6e6"/><rect x="60" y="610" width="940" height="18" rx="9" fill="#e6e6e6"/></svg>
