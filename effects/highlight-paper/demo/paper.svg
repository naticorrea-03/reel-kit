<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="#fff"/><text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#b31b1b">Working paper</text><text x="60" y="160" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#111">Practice Beats Talent in</text><text x="60" y="230" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#111">Early Skill Learning</text><text x="60" y="300" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#555">A. Rivera, J. Okafor, M. Lind</text><rect x="60" y="380" width="1080" height="16" rx="8" fill="#e8e8e8"/><rect x="60" y="420" width="1000" height="16" rx="8" fill="#e8e8e8"/><rect x="60" y="460" width="1040" height="16" rx="8" fill="#e8e8e8"/><text x="60" y="1040" font-family="Georgia, serif" font-size="34" fill="#222">Participants who practiced daily improved</text><text x="60" y="1090" font-family="Georgia, serif" font-size="34" fill="#222">twice as fast as the control group.</text></svg>
